name: Build HybridBridge APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify tests and APK licenses
        shell: pwsh
        run: |
          $tests = 0; $failures = 0; $errors = 0
          Get-ChildItem 'app/build/test-results/testDebugUnitTest/*.xml' | ForEach-Object {
            [xml]$report = Get-Content $_.FullName -Raw
            $tests += [int]$report.testsuite.tests
            $failures += [int]$report.testsuite.failures
            $errors += [int]$report.testsuite.errors
          }
          if ($tests -lt 21 -or $failures -ne 0 -or $errors -ne 0) { throw "Tests invalides : $tests tests, $failures echecs, $errors erreurs" }
          $apk = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'app/build/outputs/apk/debug/app-debug.apk'))
          try {
            foreach ($path in @('assets/licenses/GPL-3.0.txt', 'assets/licenses/Protobuf-License.txt')) {
              if ($null -eq $apk.GetEntry($path)) { throw "Licence absente : $path" }
            }
          } finally { $apk.Dispose() }
          Write-Output "$tests tests, $failures failures, $errors errors ; APK licenses verified"
      - uses: actions/upload-artifact@v4
        with:
          name: HybridBridge-0.4.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HybridBridge-0.4.1-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: HybridBridge-0.4.1-corresponding-source
          path: |
            app/src/
            app/build.gradle.kts
            app/build/meshtastic-protos/
            app/build/bitchat-protocol-source/
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            LICENSE
            docs/
